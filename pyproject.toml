[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "irene-capture"
dynamic = ["version"]
description = "Capture impulse responses from audio plugins (companion tool to the IRene IR loader)"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
authors = [{ name = "anschae" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "soundfile>=0.12",
    "pedalboard>=0.9.14",
]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.7", "pyqtgraph>=0.13.7"]
dev = ["pytest>=8", "ruff>=0.6", "pyinstaller>=6.10"]

[project.scripts]
irene-capture = "irene_capture.__main__:main"

[project.urls]
Homepage = "https://github.com/anschae/irene-capture"
"IR loader" = "https://github.com/anschae/irene"

[tool.setuptools.dynamic]
version = { attr = "irene_capture._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
irene_capture = ["resources/*.md", "resources/*.png"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]
ignore = ["E501", "SIM108", "B905", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "gui: needs PySide6 (skipped if not installed)",
    "slow: takes more than a few seconds",
]

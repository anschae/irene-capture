name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # for the release job

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1
      - run: pip install -e ".[gui,dev]"
      - run: pytest -q

  build:
    name: build (${{ matrix.platform }})
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows }
          - { os: macos-latest, platform: macos-arm64 }
          - { os: macos-15-intel, platform: macos-intel }  # last Intel runner, supported until fall 2027
          - { os: ubuntu-22.04, platform: linux }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1
      - name: Install
        run: pip install . "PySide6-Essentials>=6.7" "pyqtgraph>=0.13.7" "pyinstaller>=6.10" pillow
      - name: Version
        id: version
        run: |
          VERSION=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('src/irene_capture/_version.py').read()).group(1))")
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$VERSION" ]]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} does not match _version.py ($VERSION)"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "COMMIT = \"${GITHUB_SHA::7}\"" > src/irene_capture/_build_info.py
      - name: PyInstaller
        run: pyinstaller packaging/irene-capture.spec --noconfirm
      - name: Package and self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # A windowed .exe has no console: wait for it explicitly and read its log file.
          $p = Start-Process -FilePath dist\irene-capture.exe -ArgumentList '--selftest','--log','selftest.log' -PassThru
          $null = $p.Handle  # needed so that ExitCode is available after WaitForExit
          $p.WaitForExit()
          Get-Content selftest.log
          Write-Host "exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0 -or -not (Select-String -Path selftest.log -Pattern 'Self-test passed' -Quiet)) { exit 1 }
          Compress-Archive -Path dist\irene-capture.exe -DestinationPath "irene-capture-${{ steps.version.outputs.version }}-${{ matrix.platform }}.zip"
      - name: Package and self-test (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - dist/irene-capture.app
          dist/irene-capture.app/Contents/MacOS/irene-capture --selftest
          ditto -c -k --sequesterRsrc --keepParent dist/irene-capture.app "irene-capture-${{ steps.version.outputs.version }}-${{ matrix.platform }}.zip"
      - name: Package and self-test (Linux)
        if: runner.os == 'Linux'
        run: |
          QT_QPA_PLATFORM=offscreen dist/irene-capture --selftest
          cd dist && zip -9 "../irene-capture-${{ steps.version.outputs.version }}-${{ matrix.platform }}.zip" irene-capture
      - name: Check the macOS zip as users get it (Finder extracts with ditto)
        if: runner.os == 'macOS'
        run: |
          rm -rf /tmp/zipcheck && ditto -x -k "irene-capture-${{ steps.version.outputs.version }}-${{ matrix.platform }}.zip" /tmp/zipcheck
          /tmp/zipcheck/irene-capture.app/Contents/MacOS/irene-capture --version
          codesign --verify --deep /tmp/zipcheck/irene-capture.app && echo "signature OK"

      # ---- Spike/diagnostics for the direct route with real third-party plugins (never blocks the build).
      # Loads a free VST3 in the frozen app, opens its editor in the worker process, closes it after a few
      # seconds, then captures. macOS also tries Apple's built-in AU (AULowpass).
      - name: "Spike: get plugins"
        if: matrix.platform != 'macos-intel'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p spike && cd spike
          case "$RUNNER_OS" in
            Windows) PAT="*[Ww]in*64*";; macOS) PAT="*macos-universal*";; Linux) PAT="*[Ll]inux*x86*64*";;
          esac
          gh release download --repo michaelwillis/dragonfly-reverb --pattern "$PAT" || true
          if [ "$RUNNER_OS" = "Windows" ]; then
            gh release download --repo surge-synthesizer/releases-xt --pattern "*win64*pluginsonly*" || \
            gh release download --repo surge-synthesizer/surge --pattern "*win64*pluginsonly*" || true
          fi
          for f in *; do case "$f" in
            *.zip) unzip -q -o "$f";;
            *.tar.*|*.tgz) tar xf "$f";;
            *.dmg) hdiutil attach -nobrowse -mountpoint /tmp/df "$f" && cp -R /tmp/df/ "dmg_${f%.dmg}"; hdiutil detach /tmp/df;;
          esac; done
          for p in $(find . -maxdepth 4 -name "*.pkg"); do pkgutil --expand-full "$p" "${p%.pkg}_expanded" || true; done
          find . -maxdepth 10 -name "*.vst3" -prune | head -30
      - name: "Spike: editor and capture"
        if: matrix.platform != 'macos-intel'
        continue-on-error: true
        run: |
          set +e
          export PYTHONUNBUFFERED=1
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y xvfb openbox > /dev/null
            Xvfb :99 -screen 0 1280x1024x24 & sleep 2; export DISPLAY=:99; openbox & sleep 1
          fi
          case "$RUNNER_OS" in
            Windows) APP=dist/irene-capture.exe;; macOS) APP=dist/irene-capture.app/Contents/MacOS/irene-capture;; *) APP=dist/irene-capture;;
          esac
          winpath() { if [ "$RUNNER_OS" = "Windows" ]; then cygpath -w "$1"; else echo "$1"; fi; }
          # run the app; on Windows (windowed .exe) via Start-Process with a log file and a time limit
          app() {
            if [ "$RUNNER_OS" = "Windows" ]; then
              ARGS=""; for a in "$@"; do ARGS="$ARGS,'\"$a\"'"; done
              pwsh -Command "\$p = Start-Process -FilePath '$APP' -ArgumentList @('--log','run.txt'$ARGS) -PassThru; \$null = \$p.Handle; if (-not \$p.WaitForExit(150000)) { \$p.Kill(); Write-Host 'TIMEOUT' }; Get-Content run.txt; exit \$p.ExitCode"
            elif command -v timeout > /dev/null; then timeout 150 "$APP" "$@"
            else perl -e 'alarm shift; exec @ARGV' 150 "$APP" "$@"; fi
          }
          RESULTS=""
          if [ "$RUNNER_OS" = "macOS" ]; then
            AU=/System/Library/Components/CoreAudio.component
            echo "::group::Apple AULowpass (AU) — plain Python first"
            perl -e 'alarm shift; exec @ARGV' 60 python tools/vst3_probe.py $AU "Apple: AULowpass"
            if [ $? -eq 0 ]; then
              app spike-editor --plugin $AU --plugin-name "Apple: AULowpass" --seconds 3; E=$?
              app plugin-capture --plugin $AU --plugin-name "Apple: AULowpass" --type eq --out-dir spike-out; C=$?
            else E="skipped (plain pedalboard hangs too)"; C=$E; fi
            echo "::endgroup::"
            RESULTS="$RESULTS\nApple AULowpass: editor exit=$E, capture exit=$C"
          fi
          for NAME in DragonflyEarlyReflections DragonflyRoomReverb "Surge XT Effects"; do
            P=$(find "$PWD/spike" -maxdepth 10 -name "$NAME.vst3" -prune | head -1)
            [ -z "$P" ] && continue
            P=$(winpath "$P")
            echo "::group::$NAME (plain Python, for comparison)"
            python tools/vst3_probe.py "$P" 2>&1 | tail -15
            pkill -f "irene-capture.*multiprocessing" 2>/dev/null || true
            echo "::endgroup::"
            echo "::group::$NAME: editor"
            app spike-editor --plugin "$P" --seconds 4; E=$?
            echo "::endgroup::"
            echo "::group::$NAME: capture"
            app plugin-capture --plugin "$P" --type reverb --ir-length 2 --editor-seconds 3 --out-dir "spike-out"; C=$?
            echo "::endgroup::"
            RESULTS="$RESULTS\n$NAME: editor exit=$E, capture exit=$C"
          done
          ls -la spike-out
          echo -e "SPIKE RESULTS ($RUNNER_OS):$RESULTS" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          path: irene-capture-${{ steps.version.outputs.version }}-${{ matrix.platform }}.zip
          archive: false
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true

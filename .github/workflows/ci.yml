name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # for the release job

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1
      - run: pip install -e ".[gui,dev]"
      - run: pytest -q

  build:
    name: build (${{ matrix.platform }})
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows }
          - { os: macos-latest, platform: macos-arm64 }
          - { os: macos-15-intel, platform: macos-intel }  # last Intel runner, supported until fall 2027
          - { os: ubuntu-22.04, platform: linux }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1
      - name: Install
        run: pip install . "PySide6-Essentials>=6.7" "pyqtgraph>=0.13.7" "pyinstaller>=6.10" pillow
      - name: Version
        id: version
        run: |
          VERSION=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('src/irene_capture/_version.py').read()).group(1))")
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$VERSION" ]]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} does not match _version.py ($VERSION)"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "COMMIT = \"${GITHUB_SHA::7}\"" > src/irene_capture/_build_info.py
      - name: PyInstaller
        run: pyinstaller packaging/irene-capture.spec --noconfirm
      - name: Package and self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # A windowed .exe has no console: wait for it explicitly and read its log file.
          $p = Start-Process -FilePath dist\irene-capture.exe -ArgumentList '--selftest','--log','selftest.log' -PassThru
          $null = $p.Handle  # needed so that ExitCode is available after WaitForExit
          $p.WaitForExit()
          Get-Content selftest.log
          Write-Host "exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0 -or -not (Select-String -Path selftest.log -Pattern 'Self-test passed' -Quiet)) { exit 1 }
          Compress-Archive -Path dist\irene-capture.exe -DestinationPath "irene-capture-${{ steps.version.outputs.version }}-${{ matrix.platform }}.zip"
      - name: Package and self-test (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - dist/irene-capture.app
          dist/irene-capture.app/Contents/MacOS/irene-capture --selftest
          ditto -c -k --sequesterRsrc --keepParent dist/irene-capture.app "irene-capture-${{ steps.version.outputs.version }}-${{ matrix.platform }}.zip"
      - name: Package and self-test (Linux)
        if: runner.os == 'Linux'
        run: |
          QT_QPA_PLATFORM=offscreen dist/irene-capture --selftest
          cd dist && zip -9 "../irene-capture-${{ steps.version.outputs.version }}-${{ matrix.platform }}.zip" irene-capture
      - uses: actions/upload-artifact@v7
        with:
          path: irene-capture-${{ steps.version.outputs.version }}-${{ matrix.platform }}.zip
          archive: false
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true

  # Spike/diagnostics for the direct route with real third-party plugins: loads a free VST3
  # (Dragonfly Reverb, GPL) and on macOS an Apple AU, opens the editor in the worker process of
  # the *frozen* app, closes it after a few seconds and captures. Doesn't block releases.
  plugin-spike:
    name: plugin spike (${{ matrix.platform }})
    needs: build
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows, pattern: "*[Ww]in*64*" }
          - { os: macos-latest, platform: macos-arm64, pattern: "*[Mm]ac*" }
          - { os: ubuntu-22.04, platform: linux, pattern: "*[Ll]inux*x86*64*" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifact
          pattern: "*-${{ matrix.platform }}.zip"
          merge-multiple: true
      - name: Unpack app
        run: |
          cd artifact
          find . -maxdepth 3 | head -20
          Z=$(find . -type f -name "*.zip" | head -1)
          if [ -n "$Z" ]; then unzip -q -o "$Z"; fi
          find . -maxdepth 4 \( -name "irene-capture.exe" -o -name "irene-capture" \) | head
      - name: Linux display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libfreetype6 libasound2
          Xvfb :99 -screen 0 1280x1024x24 & echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Download Dragonfly Reverb
        run: |
          mkdir plugins && cd plugins
          gh release download --repo michaelwillis/dragonfly-reverb --pattern "${{ matrix.pattern }}" || gh release view --repo michaelwillis/dragonfly-reverb
          for f in *; do case "$f" in *.zip) unzip -q "$f";; *.tar.*|*.tgz) tar xf "$f";; *.dmg) hdiutil attach -nobrowse -mountpoint /tmp/df "$f" && cp -R /tmp/df/* . ;; esac; done
          find . -maxdepth 6 -name "*.vst3" | head -20
          P=$(find "$PWD" -maxdepth 6 -name 'DragonflyRoomReverb.vst3' | head -1)
          if [ "$RUNNER_OS" = "Windows" ]; then P=$(cygpath -w "$P"); fi
          echo "VST3=$P" >> "$GITHUB_ENV"
      - name: Spike (frozen app)
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then APP=$(find artifact -name irene-capture.exe | head -1)
          elif [ "$RUNNER_OS" = "macOS" ]; then APP=$(find artifact -path "*irene-capture.app/Contents/MacOS/irene-capture" | head -1)
          else APP=$(find artifact -type f -name irene-capture | head -1); chmod +x "$APP"; fi
          echo "App: $APP"
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "::group::list"; "$APP" --log l.txt list-plugins plugins || true; sleep 2; cat l.txt || true; echo "::endgroup::"
          echo "Plugin: $VST3"
          set +e
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -Command "\$p = Start-Process -FilePath '$APP' -ArgumentList @('--log','spike.txt','spike-editor','--plugin','\"$VST3\"','--seconds','4') -PassThru; \$null = \$p.Handle; \$p.WaitForExit(); Get-Content spike.txt; exit \$p.ExitCode"; E=$?
            pwsh -Command "\$p = Start-Process -FilePath '$APP' -ArgumentList @('--log','cap.txt','plugin-capture','--plugin','\"$VST3\"','--type','reverb','--ir-length','2','--editor-seconds','3','--out-dir','out') -PassThru; \$null = \$p.Handle; \$p.WaitForExit(); Get-Content cap.txt; exit \$p.ExitCode"; C=$?
          else
            "$APP" spike-editor --plugin "$VST3" --seconds 4; E=$?
            "$APP" plugin-capture --plugin "$VST3" --type reverb --ir-length 2 --editor-seconds 3 --out-dir out; C=$?
          fi
          ls -la out || true
          echo "editor exit=$E capture exit=$C"
          test $E -eq 0 -a $C -eq 0
      - name: Apple AU (macOS)
        if: runner.os == 'macOS'
        run: |
          "$APP" spike-editor --plugin /System/Library/Components/CoreAudio.component --plugin-name "Apple: AULowpass" --seconds 3
          "$APP" plugin-capture --plugin /System/Library/Components/CoreAudio.component --plugin-name "Apple: AULowpass" --type eq --out-dir out-au
          ls -la out-au

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # for the release job

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1
      - run: pip install -e ".[gui,dev]"
      - run: pytest -q

  build:
    name: build (${{ matrix.platform }})
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows }
          - { os: macos-latest, platform: macos-arm64 }
          - { os: macos-15-intel, platform: macos-intel }  # last Intel runner, supported until fall 2027
          - { os: ubuntu-22.04, platform: linux }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1
      - name: Install
        run: pip install . "PySide6-Essentials>=6.7" "pyqtgraph>=0.13.7" "pyinstaller>=6.10" pillow
      - name: Version
        id: version
        run: |
          VERSION=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('src/irene_capture/_version.py').read()).group(1))")
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$VERSION" ]]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} does not match _version.py ($VERSION)"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "COMMIT = \"${GITHUB_SHA::7}\"" > src/irene_capture/_build_info.py
      - name: PyInstaller
        run: pyinstaller packaging/irene-capture.spec --noconfirm
      - name: Package and self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\irene-capture.exe -ArgumentList '--selftest','--log','selftest.log' -Wait -PassThru
          Get-Content selftest.log
          if ($p.ExitCode -ne 0) { exit 1 }
          Compress-Archive -Path dist\irene-capture.exe -DestinationPath "irene-capture-${{ steps.version.outputs.version }}-${{ matrix.platform }}.zip"
      - name: Package and self-test (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - dist/irene-capture.app
          dist/irene-capture.app/Contents/MacOS/irene-capture --selftest
          ditto -c -k --sequesterRsrc --keepParent dist/irene-capture.app "irene-capture-${{ steps.version.outputs.version }}-${{ matrix.platform }}.zip"
      - name: Package and self-test (Linux)
        if: runner.os == 'Linux'
        run: |
          QT_QPA_PLATFORM=offscreen dist/irene-capture --selftest
          cd dist && zip -9 "../irene-capture-${{ steps.version.outputs.version }}-${{ matrix.platform }}.zip" irene-capture
      - uses: actions/upload-artifact@v7
        with:
          path: irene-capture-${{ steps.version.outputs.version }}-${{ matrix.platform }}.zip
          archive: false
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
